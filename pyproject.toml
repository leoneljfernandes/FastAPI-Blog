[project]
name = "fastapi-blog"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "leoneljfernandes", email = "leojfernandes@protonmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aiosmtplib>=5.1.2",
    "aiosqlite>=0.22.1",
    "alembic>=1.19.2",
    "asyncpg>=0.31.0",
    "boto3>=1.43.90",
    "fastapi[standard]>=0.141.1",
    "greenlet>=3.5.5",
    "httpx2>=2.12.0",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.3.5",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.13.0",
    "pytest>=9.1.1",
    "sqlalchemy>=2.0.52",
]

[project.scripts]
fastapi-blog = "fastapi_blog:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "moto[s3]>=5.2.3",
]
